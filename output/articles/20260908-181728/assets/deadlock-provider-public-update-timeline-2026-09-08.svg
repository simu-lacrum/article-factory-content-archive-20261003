<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Deadlock provider public update timeline</title>
  <desc id="desc">Public update evidence checked September 8, 2026. Predator July 21, Octarine August 25, Melonity September 2. No dated public Deadlock log found for Cluster or Umbrella.</desc>
  <rect width="1600" height="900" fill="#0E0E10"/>
  <rect x="70" y="60" width="1460" height="780" rx="30" fill="#17171B" stroke="#2B58FF" stroke-width="4"/>
  <text x="125" y="145" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="48" font-weight="700">DEADLOCK PATCH-EVIDENCE TIMELINE</text>
  <text x="125" y="192" fill="#AEB0BA" font-family="Arial, sans-serif" font-size="23">Latest dated public note visible on 8 Sep 2026 · page evidence only</text>
  <line x1="230" y1="455" x2="1370" y2="455" stroke="#5B5B67" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Arial, sans-serif">
    <circle cx="390" cy="455" r="22" fill="#6DB33F"/>
    <text x="390" y="365" text-anchor="middle" fill="#F2F2F2" font-size="30" font-weight="700">PREDATOR</text>
    <text x="390" y="405" text-anchor="middle" fill="#AEB0BA" font-size="24">21 Jul 2026</text>
    <text x="390" y="515" text-anchor="middle" fill="#D4D4DB" font-size="20">Dated, low-detail note</text>

    <circle cx="790" cy="455" r="22" fill="#635FD5"/>
    <text x="790" y="365" text-anchor="middle" fill="#F2F2F2" font-size="30" font-weight="700">OCTARINE</text>
    <text x="790" y="405" text-anchor="middle" fill="#AEB0BA" font-size="24">25 Aug 2026</text>
    <text x="790" y="515" text-anchor="middle" fill="#D4D4DB" font-size="20">Concrete cross-game release</text>

    <circle cx="1190" cy="455" r="22" fill="#FF1469"/>
    <text x="1190" y="365" text-anchor="middle" fill="#F2F2F2" font-size="30" font-weight="700">MELONITY</text>
    <text x="1190" y="405" text-anchor="middle" fill="#AEB0BA" font-size="24">2 Sep 2026</text>
    <text x="1190" y="515" text-anchor="middle" fill="#D4D4DB" font-size="20">24-item change log</text>
  </g>

  <rect x="170" y="610" width="560" height="125" rx="20" fill="#202027" stroke="#635FD5" stroke-width="3"/>
  <text x="205" y="658" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="28" font-weight="700">CLUSTER</text>
  <text x="205" y="700" fill="#AEB0BA" font-family="Arial, sans-serif" font-size="21">Current product page; no dated public Deadlock log found</text>

  <rect x="870" y="610" width="560" height="125" rx="20" fill="#202027" stroke="#6DB33F" stroke-width="3"/>
  <text x="905" y="658" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="28" font-weight="700">UMBRELLA</text>
  <text x="905" y="700" fill="#AEB0BA" font-family="Arial, sans-serif" font-size="21">Current product page; no dated public Deadlock log found</text>

  <text x="125" y="790" fill="#AEB0BA" font-family="Arial, sans-serif" font-size="20">A dated vendor note documents communication. It does not prove present compatibility, service quality, or account outcomes.</text>
</svg>
