  <line x1="120" y1="755" x2="1280" y2="755" stroke="#3A3A44" stroke-width="2"/>
  <text x="610" y="810" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="34" font-weight="700">TOTAL 57 / 100</text>
  <text x="970" y="810" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="34" font-weight="700">TOTAL 85 / 100</text>
