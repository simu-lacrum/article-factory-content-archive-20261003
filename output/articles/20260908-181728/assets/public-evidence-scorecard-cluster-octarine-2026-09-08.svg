<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Cluster and Octarine public-evidence scorecard</title>
  <desc id="desc">A weighted evidence-visibility scorecard checked September 8, 2026. Cluster scores 57 and Octarine scores 85 out of 100. Scores do not measure safety.</desc>
  <rect width="1400" height="900" fill="#0E0E10"/>
  <rect x="70" y="60" width="1260" height="780" rx="28" fill="#17171B" stroke="#2B58FF" stroke-width="4"/>
  <text x="120" y="135" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="46" font-weight="700">PUBLIC-EVIDENCE SCORECARD</text>
  <text x="120" y="178" fill="#AEB0BA" font-family="Arial, sans-serif" font-size="22">Visibility only · checked 8 Sep 2026 · not a safety score</text>
  <text x="680" y="235" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="26" font-weight="700">CLUSTER</text>
  <text x="1040" y="235" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="26" font-weight="700">OCTARINE</text>

  <g font-family="Arial, sans-serif" font-size="24" fill="#F2F2F2">
    <text x="120" y="310">Product page · 20%</text>
    <text x="120" y="410">Dated changelog · 25%</text>
    <text x="120" y="510">Public documentation · 20%</text>
    <text x="120" y="610">Support route · 15%</text>
    <text x="120" y="710">Limits / risk disclosure · 20%</text>
  </g>

  <g fill="#292932">
    <rect x="610" y="278" width="280" height="36" rx="18"/><rect x="970" y="278" width="280" height="36" rx="18"/>
    <rect x="610" y="378" width="280" height="36" rx="18"/><rect x="970" y="378" width="280" height="36" rx="18"/>
    <rect x="610" y="478" width="280" height="36" rx="18"/><rect x="970" y="478" width="280" height="36" rx="18"/>
    <rect x="610" y="578" width="280" height="36" rx="18"/><rect x="970" y="578" width="280" height="36" rx="18"/>
    <rect x="610" y="678" width="280" height="36" rx="18"/><rect x="970" y="678" width="280" height="36" rx="18"/>
  </g>
  <g fill="#635FD5">
    <rect x="610" y="278" width="280" height="36" rx="18"/>
    <rect x="610" y="478" width="112" height="36" rx="18"/>
    <rect x="610" y="578" width="280" height="36" rx="18"/>
    <rect x="610" y="678" width="196" height="36" rx="18"/>
  </g>
  <g fill="#2B58FF">
    <rect x="970" y="278" width="280" height="36" rx="18"/>
    <rect x="970" y="378" width="280" height="36" rx="18"/>
    <rect x="970" y="478" width="224" height="36" rx="18"/>
    <rect x="970" y="578" width="224" height="36" rx="18"/>
    <rect x="970" y="678" width="168" height="36" rx="18"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#F2F2F2" text-anchor="middle">
    <text x="750" y="305">20 / 20</text><text x="1110" y="305">20 / 20</text>
    <text x="750" y="405">0 / 25</text><text x="1110" y="405">25 / 25</text>
    <text x="750" y="505">8 / 20</text><text x="1110" y="505">16 / 20</text>
    <text x="750" y="605">15 / 15</text><text x="1110" y="605">12 / 15</text>
    <text x="750" y="705">14 / 20</text><text x="1110" y="705">12 / 20</text>
