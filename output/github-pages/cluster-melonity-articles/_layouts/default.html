<!doctype html>
<html lang="{{ page.language | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.seo_title | default: page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.seo_title | default: page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">Game Product Comparison Guides</a>
    </header>
    <main class="page-shell">
      <article class="article-content">
        {{ content }}
      </article>
    </main>
    <footer class="site-footer">Evidence-led guides for CS2, Deadlock, and Dota 2.</footer>
  </body>
</html>
